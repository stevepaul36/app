services:
  - type: web
    name: willowvale-animal-town
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: willowvale-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://willowvale-animal-town.onrender.com
databases:
  - name: willowvale-db
    plan: basic-256mb
    databaseName: willowvale
    user: willowvale