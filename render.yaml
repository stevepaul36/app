# Matches the live free web service. Accounts and cloud saves use a free MongoDB Atlas (M0) cluster:
# set MONGODB_URI in the Render dashboard (it is never stored in this file). Without it the game runs
# in guest mode with progress kept on each device.
services:
  - type: web
    name: willowvale-animal-town
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://willowvale-animal-town.onrender.com
