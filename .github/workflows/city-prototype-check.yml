name: City prototype checks
on:
  push:
    branches: [city-redesign]
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.js'
      - 'package.json'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
