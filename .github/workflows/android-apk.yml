name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, game-development]
    paths:
      - 'public/**'
      - 'server.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
  actions: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript and backend smoke tests
        run: npm run check
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: willowvale-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Willowvale.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Willowvale.apk \
            --title "Willowvale for Android (latest build)" \
            --notes "Debug APK built automatically from main at ${GITHUB_SHA}. Install it on Android by allowing installs from your browser. It plays the same game as the web version and connects to the Render server for accounts." \
            --target "${GITHUB_SHA}"
