<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5BC0EB">
<meta name="description" content="Willowvale is a sunny island town of animal neighbours. Explore four districts, visit places, make friends and find a home.">
<title>Willowvale — Animal Town</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=estate-1">
</head>
<body>
<main id="game-shell">
  <canvas id="world" aria-label="Willowvale island town. Tap the ground to walk, tap buildings and neighbours to visit them."></canvas>

  <header class="hud">
    <button id="radar-button" class="radar" aria-label="Map and districts">
      <canvas id="radar" width="96" height="96" aria-hidden="true"></canvas>
      <span id="district-name" class="radar-name">Town Square</span>
    </button>
    <button id="profile-button" class="hud-me" aria-label="Your character and account">
      <span class="avatar-ring" id="mood-ring"><canvas id="hud-avatar" width="40" height="40"></canvas><i id="online-dot" class="online-dot"></i></span>
      <span class="me-text"><b id="player-name">Guest</b><span id="coin-pill" class="coin-pill"><i class="coin"></i><b id="coins">35</b></span></span>
    </button>
    <button id="pause-button" class="hud-round" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.4" fill="currentColor"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.4" fill="currentColor"/></svg></button>
  </header>
  <div id="clock" class="clock"><span id="clock-time">8:00 AM</span><button id="speed-button" aria-label="Game speed 1x">▶</button></div>
  <div id="queue" class="queue" aria-label="What you’re doing"></div>

  <p id="hint" class="hint hidden">Tap anything to see what you can do. Try the fridge for breakfast, then head into town.</p>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <section id="sheet" class="sheet hidden" role="dialog" aria-label="Details">
    <div class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-head">
      <div><small id="sheet-kicker"></small><h2 id="sheet-title"></h2></div>
      <button id="sheet-close" class="sheet-close" aria-label="Close">×</button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <div id="controls" class="controls">
    <div id="joystick" class="joystick" role="application" aria-label="Movement stick"><div id="joy-knob" class="joy-knob"></div></div>
    <div class="action-cluster">
      <button id="cam-button" class="ctl ctl-cam" aria-label="Camera: centre on me and change zoom"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 016.5 6h1.7l1.3-2h5l1.3 2h1.7A2.5 2.5 0 0120 8.5v8a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 16.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button id="view-button" class="ctl ctl-view" aria-pressed="false" aria-label="Follow camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></button>
      <button id="decor-button" class="ctl ctl-decor" aria-label="Decorate your home">🛋️</button>
      <button id="dice-button" class="ctl ctl-dice" aria-label="Roll the dice (Paws &amp; Properties)">🎲</button>
      <button id="exit-button" class="ctl ctl-exit" aria-label="Go outside">🚪</button>
      <button id="boat-exit" class="ctl ctl-boat" aria-label="Back to shore">⚓</button>
      <button id="run-button" class="ctl ctl-run" aria-pressed="false" aria-label="Run"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="14.5" cy="4.5" r="2.2" fill="currentColor"/><path d="M9 21l2.5-5.5 3 2.5V22M7 11l3.5-3.5 4 1 2 3.5 3 1M11.5 15.5l1.5-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="act-button" class="ctl ctl-act" aria-label="Interact" disabled><span id="act-icon" class="act-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 12V6.5a1.5 1.5 0 013 0V11m0-5.5v-1a1.5 1.5 0 013 0V11m0-5a1.5 1.5 0 013 0v6.5c0 4.4-2.8 7.5-6.5 7.5-2.4 0-4-1.3-5.4-3.3L4.3 13a1.5 1.5 0 012.4-1.8L8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><small id="act-label">Nearby</small></button>
    </div>
  </div>

  <nav class="dock" aria-label="Game menu">
    <button class="dock-item active" data-mode="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z M9 4v13.5 M15 6.5V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Explore</span></button>
    <button class="dock-item" data-mode="homes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7M6 9.5V20h12V9.5M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Homes</span></button>
    <button class="dock-item" data-mode="places"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.5" fill="currentColor"/></svg><span>Places</span></button>
    <button class="dock-item" data-mode="friends"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.2 4.2 0 0112 7.6 4.2 4.2 0 0119.5 10c0 5.4-7.5 10-7.5 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Friends</span></button>
    <button class="dock-item" data-mode="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11a3 3 0 013 3V20H8a3 3 0 01-3-3z M5 17a3 3 0 013-3h11 M9 8h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Journal</span></button>
  </nav>

  <section id="onboarding" class="onboarding" aria-labelledby="ob-title">
    <div class="ob-card">
      <div class="wordmark" aria-hidden="true"><span>Willowvale</span><small>an island of animal neighbours</small></div>
      <h1 id="ob-title" class="sr-only">Welcome to Willowvale</h1>
      <canvas id="onboard-avatar" class="ob-avatar" width="132" height="132" aria-hidden="true"></canvas>
      <p class="ob-lead">Who will you be?</p>
      <div id="editor-slot"></div>
      <label class="field ob-name"><span>Your name in town</span><input id="name-input" maxlength="14" autocomplete="off"></label>
      <button id="start-button" class="btn btn-primary btn-wide btn-big">Start exploring</button>
      <button id="signin-link" class="link-button">I already have an account</button>
    </div>
  </section>

  <div id="pie" class="pie hidden"><div id="pie-ring" class="pie-ring"></div><span id="pie-title" class="sr-only"></span></div>
  <div id="unlock" class="unlock hidden" role="status" aria-live="polite"><small id="unlock-title">New emojis unlocked!</small><div id="unlock-emojis" class="unlock-emojis"></div><span id="unlock-label"></span></div>
  <div id="ride" class="ride hidden" role="status" aria-live="polite"><div class="ride-card"><small><span id="ride-from"></span> → <span id="ride-to"></span></small><div class="ride-road"><span class="ride-bus">🚌</span><span id="ride-icon" class="ride-dest"></span></div><b>On the island bus…</b></div></div>
  <div id="decor-bar" class="decor-bar hidden" role="toolbar" aria-label="Decorating"></div>
  <div id="fade" class="fade" aria-hidden="true"></div>
  <div id="loading" class="loading" aria-hidden="true"><span>Willowvale</span></div>
</main>
<script type="module" src="app.js?v=estate-1"></script>
</body>
</html>
